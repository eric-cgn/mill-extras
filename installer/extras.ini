; Install Millennium Pack, made with EUP. tools/extras.py copies this file into
; build/installer/stage with the files it names, leaves out the [component]s whose
; Plug-In isn't built, and runs eup build on it. A component's ID is its Plug-In's folder in
; plugins/, and its source is the .bin that folder's build.sh writes in build/.

[installer]
product = Millennium Pack
version = 1.0
file = Install Millennium Pack
get_info = Install Millennium Pack 1.0, © 2026 OneInAMillion Software. Freeware.
; the folder Install Location starts on, at the top of the startup disk, as Install Mill's
folder = Mill
; Install Mill's creator and icon: the Finder keeps one icon to a creator
creator = MiLI
icon = Install icon.bin

[type easy]
label = Easy Install
description_file = Easy Install.txt

[type custom]
label = Custom Install
custom = yes

[group plugins]
label = Plug-Ins
selectable = yes

[component text]
group = plugins
label = Modern Text
description = Markdown and Gemtext.
source = Modern Text.bin
destination = %chosen%:Mill Plug-Ins
types = easy, custom

[component mastodon]
group = plugins
label = Mastodon
description = Mastodon timelines, accounts, and threads.
source = Mastodon.bin
destination = %chosen%:Mill Plug-Ins
types = easy, custom

[component mqtt]
group = plugins
label = MQTT
description = MQTT topics as pages, and publishing.
source = MQTT.bin
destination = %chosen%:Mill Plug-Ins
types = easy, custom

[upgrade]
; Choose… the folder that holds Mill (or Save with Mill's folder named): the Plug-Ins go
; into its Mill Plug-Ins folder
detect = Mill
; and only there: with no Mill in the place, Install is refused ("Install Mill first, ...")
require = Mill
